<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form action="">
        <!--First Name-->
        <label for="First Name">First Name</label>
        <input type="text" id="First Name">
        <br>
        <br>
        <!--Last Name-->
        <label for="Last Name">Last Name</label>
        <input type="text" id="Last Name">
        <br>
        <br>
        <!--Phone Number-->
        <label for="Phone Number">Phone Number</label>
        <input type="digits" id="Phone Number">
        <br>
        <br>
        <!--Age-->
        <label for="Age">Age</label>
        <input type="digits" id="Age">
        <br>
        <br>
        <!--Email-->
        <label for="Email">Email</label>
        <input type="text" id="Email">
        <br>
        <br>
        <!--Gender-->
        <label for="Gender">Gender</label>
        <input type="digits" id="Gender">
        <br>
        <br>
        <!--Address-->
        <label for="Address">Address</label>
        <input type="text" id="Address">
        <br>
        <br>
        <!--Marksheets-->
        <label for="10th Marksheet">Marks Obtained in class 10th</label>
        <input type="digits" id="10th Marksheet">
        <br>
        <br>
        <label for="12th Marksheet">Marks Obtained in class 12th</label>
        <input type="digits" id="12th Marksheet">
        <br>
        <br>
        <!--Password-->
        <label for="Password">Password</label>
        <input type="password" id="Password">
        <br>
        <br>
        <!--Submit Button-->
        <button type="submit">Submit</button>
    </form>
</body>
</html>
